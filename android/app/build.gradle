apply plugin: 'com.android.application'

// Release signing reads these from ~/.gradle/gradle.properties so no key material lives in the
// repo. See README "Building the Android APK".
def signingProps = [
    'ICEBRAKER_KEYSTORE',
    'ICEBRAKER_KEYSTORE_PASSWORD',
    'ICEBRAKER_KEY_ALIAS',
    'ICEBRAKER_KEY_PASSWORD',
]
def missingSigningProps = signingProps.findAll { !project.hasProperty(it) }

android {
    namespace = "io.github.jessisena.icebraker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "io.github.jessisena.icebraker"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1
        versionName = "1.0"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    lint {
        warningsAsErrors = true
        abortOnError = true
    }
    signingConfigs {
        release {
            if (missingSigningProps.isEmpty()) {
                storeFile = file(ICEBRAKER_KEYSTORE.replaceFirst('^~', System.getProperty('user.home')))
                storePassword = ICEBRAKER_KEYSTORE_PASSWORD
                keyAlias = ICEBRAKER_KEY_ALIAS
                keyPassword = ICEBRAKER_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Fail before building rather than emit an unsigned APK that friends can't install
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)Release/ }
    if (buildsRelease && !missingSigningProps.isEmpty()) {
        throw new GradleException(
            "Release signing is not configured. Missing in ~/.gradle/gradle.properties: " +
            "${missingSigningProps.join(', ')}. See README \"Building the Android APK\".")
    }
}
