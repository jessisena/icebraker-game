<svg
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 300 300"
    width="300"
    height="300"
>
    <!-- Cabeza del burro -->
    <ellipse cx="150" cy="130" rx="60" ry="70" fill="gray" stroke="black" stroke-width="4"/>

    <!-- Orejas del burro -->
    <ellipse cx="110" cy="50" rx="25" ry="60" fill="gray" stroke="black" stroke-width="4"/>
    <ellipse cx="190" cy="50" rx="25" ry="60" fill="gray" stroke="black" stroke-width="4"/>

    <!-- Parte interna de las orejas -->
    <ellipse cx="110" cy="50" rx="15" ry="40" fill="lightgray"/>
    <ellipse cx="190" cy="50" rx="15" ry="40" fill="lightgray"/>

    <!-- Ojos del burro -->
    <circle cx="130" cy="120" r="12" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="170" cy="120" r="12" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="132" cy="122" r="6" fill="black"/>
    <circle cx="172" cy="122" r="6" fill="black"/>

    <!-- Hocico -->
    <ellipse cx="150" cy="170" rx="35" ry="30" fill="lightgray" stroke="black" stroke-width="3"/>
    <circle cx="138" cy="170" r="4" fill="black"/>
    <circle cx="162" cy="170" r="4" fill="black"/>

    <!-- Sonrisa -->
    <path d="M135 185 Q150 195 165 185" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>

</svg>