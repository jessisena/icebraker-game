<svg
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 200 300"
    width="200"
    height="300"
>
    <!-- Seahorse Body -->
    <path
        d="M100 20 C80 30, 60 60, 70 90 C80 120, 120 130, 110 160 C100 190, 60 200, 70 230 C80 260, 120 260, 130 240 C140 220, 120 200, 140 180 C160 160, 170 120, 150 100 C130 80, 110 80, 100 60 C90 40, 110 30, 100 20"
        fill="pink"
        stroke="darkred"
        stroke-width="5"
    />

    <!-- Seahorse Eye -->
    <circle cx="90" cy="40" r="6" fill="white" stroke="black" stroke-width="2" />
    <circle cx="88" cy="40" r="3" fill="black" />

    <!-- Seahorse Fins -->
    <path
        d="M130 130 C150 110, 170 120, 160 140 C150 160, 140 170, 130 130"
        fill="hotpink"
        stroke="darkred"
        stroke-width="4"
    />

    <!-- Seahorse Tail -->
    <path
        d="M120 250 C150 260, 160 280, 150 290 C140 300, 110 280, 120 250"
        fill="pink"
        stroke="darkred"
        stroke-width="5"
    />
</svg>